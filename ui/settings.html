<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루틴 설정 · 미션 타임플래너</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="masthead">
    <div class="masthead-top">
      <div>
        <p class="eyebrow">SETTINGS</p>
        <h1>루틴 설정</h1>
      </div>
      <div class="result-head-actions">
        <a href="planning.html" class="btn-ghost">← 편집 화면</a>
      </div>
    </div>
    <p class="sub">루틴에 일정을 등록해두면, 새 하루를 계획할 때 자동으로 채워져요. 루틴은 폴더처럼 통째로 켜고 끌 수 있어요.</p>
  </div>

  <section class="phase">
    <div class="phase-head"><h2>새 루틴 만들기</h2></div>
    <form class="task-form" id="routineForm">
      <input type="text" id="routineNameInput" placeholder="루틴 이름 (예: 아침 루틴)">
      <button type="submit">추가</button>
    </form>
  </section>

  <div id="routineList"></div>

</div>

<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
