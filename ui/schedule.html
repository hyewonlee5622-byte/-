<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 시간표 · 미션 타임플래너</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <section class="result-view">
    <div class="result-head">
      <div>
        <p class="eyebrow">FLIGHT SCHEDULE</p>
        <h2>오늘의 시간표</h2>
      </div>
      <div class="result-head-actions">
        <button type="button" id="saveImageBtn" class="btn-ghost">📷 이미지로 저장</button>
        <a href="planning.html" class="btn-ghost">다음날 일정</a>
      </div>
    </div>
    <p class="hint" style="margin:0 0 14px;">일정을 클릭하면 수정할 수 있어요.</p>

    <div class="grid-wrap">
      <div class="grid-col-header" id="gridColHeader"></div>
      <div class="grid-table" id="gridTable"></div>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="editBackdrop" hidden>
  <div class="modal-card">
    <div class="modal-header">
      <h3>일정 수정</h3>
      <button type="button" class="modal-close" id="editCloseBtn" aria-label="닫기">✕</button>
    </div>

    <div class="modal-field">
      <span class="modal-field-label">이름</span>
      <input type="text" id="editName" placeholder="할 일 이름">
    </div>

    <div class="modal-field">
      <span class="modal-field-label">시간</span>
      <div class="modal-time-row">
        <input type="text" class="clock-input" id="editStart" placeholder="HH:MM" inputmode="numeric" maxlength="5">
        <span class="modal-tilde">~</span>
        <input type="text" class="clock-input" id="editEnd" placeholder="HH:MM" inputmode="numeric" maxlength="5">
      </div>
    </div>

    <div class="modal-field">
      <span class="modal-field-label">표시</span>
      <div class="modal-chip-row">
        <button type="button" class="chip-toggle" id="editLockedChip">🔒 미루기 금지</button>
      </div>
    </div>

    <p class="warn" id="editWarn" style="display:none;"></p>

    <div class="modal-actions">
      <button type="button" id="editDeleteBtn" class="btn-text danger">삭제</button>
      <div class="modal-actions-right">
        <button type="button" id="editCancelBtn" class="modal-btn modal-btn-secondary">취소</button>
        <button type="button" id="editSaveBtn" class="modal-btn modal-btn-primary">저장</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script>
<script src="schedule.js"></script>
</body>
</html>
