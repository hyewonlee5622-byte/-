<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 시간표 · 미션 타임플래너</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <section class="result-view">
    <div class="result-head">
      <div>
        <p class="eyebrow">FLIGHT SCHEDULE</p>
        <h2>오늘의 시간표</h2>
      </div>
      <div class="result-head-actions">
        <button type="button" id="saveImageBtn" class="btn-ghost">📷 이미지로 저장</button>
        <a href="report.html" class="btn-ghost">📊 리포트</a>
        <a href="planning.html" class="btn-ghost">다음날 일정</a>
      </div>
    </div>
    <p class="hint" style="margin:0 0 14px;">일정을 클릭하면 수정할 수 있어요.</p>

    <div class="grid-wrap">
      <div class="grid-col-header" id="gridColHeader"></div>
      <div class="grid-table" id="gridTable"></div>
    </div>

    <section class="checklist-section">
      <p class="panel-label" style="margin-top:24px;">오늘 체크리스트</p>
      <ul class="checklist" id="taskChecklist"></ul>
    </section>
  </section>
</div>

<div class="modal-backdrop" id="editBackdrop" hidden>
  <div class="modal-card">
    <div class="modal-header">
      <h3>일정 수정</h3>
      <button type="button" class="modal-close" id="editCloseBtn" aria-label="닫기">✕</button>
    </div>

    <div class="modal-field">
      <span class="modal-field-label">이름</span>
      <input type="text" id="editName" placeholder="할 일 이름">
    </div>

    <div class="modal-field">
      <span class="modal-field-label">시간</span>
      <div class="modal-time-row">
        <input type="text" class="clock-input" id="editStart" placeholder="HH:MM" inputmode="numeric" maxlength="5">
        <span class="modal-tilde">~</span>
        <input type="text" class="clock-input" id="editEnd" placeholder="HH:MM" inputmode="numeric" maxlength="5">
      </div>
    </div>

    <div class="modal-field">
      <span class="modal-field-label">표시</span>
      <div class="modal-chip-row">
        <button type="button" class="chip-toggle" id="editLockedChip">🔒 미루기 금지</button>
      </div>
    </div>

    <div class="modal-field" id="pushField">
      <button type="button" class="btn-ghost" id="pushToggleBtn" style="width:100%; text-align:center;">⏩ 이 일정부터 전체 밀기</button>
      <p class="hint" id="pushLockedHint" style="display:none;">이 일정은 잠겨 있어서(미루기 금지) 밀 수 없어요.</p>

      <div id="pushPanel" style="display:none; margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:6px; background:#FAFBFC;">
        <div class="modal-time-row">
          <input type="number" id="pushMinutes" class="clock-input" min="1" step="5" value="15" style="text-align:center;">
          <span class="modal-tilde">분 밀기</span>
        </div>
        <p class="modal-field-label" style="margin-top:12px;">미루기 금지 일정과 겹치면?</p>
        <div class="modal-chip-row" id="pushStrategyRow" style="margin-top:6px; flex-wrap:wrap;">
          <button type="button" class="chip-toggle" data-strategy="cap">밀 수 있는 만큼만</button>
          <button type="button" class="chip-toggle" data-strategy="delete">겹치면 삭제</button>
          <button type="button" class="chip-toggle" data-strategy="skip">건너뛰고 이어붙이기</button>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
          <button type="button" class="modal-btn modal-btn-secondary" id="pushCancelBtn">취소</button>
          <button type="button" class="modal-btn modal-btn-primary" id="pushApplyBtn">밀기 적용</button>
        </div>
      </div>
    </div>

    <p class="warn" id="editWarn" style="display:none;"></p>

    <div class="modal-actions">
      <button type="button" id="editDeleteBtn" class="btn-text danger">삭제</button>
      <div class="modal-actions-right">
        <button type="button" id="editCancelBtn" class="modal-btn modal-btn-secondary">취소</button>
        <button type="button" id="editSaveBtn" class="modal-btn modal-btn-primary">저장</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script>
<script src="schedule.js"></script>
</body>
</html>
